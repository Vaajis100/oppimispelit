<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Isotooppipeli</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, Helvetica, sans-serif;
  background: linear-gradient(135deg, #eef7ff, #f7f2ff);
  color: #172033;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.game {
  width: min(760px, 100%);
  background: #fff;
  border-radius: 24px;
  box-shadow: 0 18px 50px rgba(30,50,90,.14);
  padding: 32px;
}
h1 {
  margin: 0 0 6px;
  font-size: clamp(30px, 5vw, 44px);
}
.subtitle {
  color: #67738b;
  margin-bottom: 22px;
}
.top {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  font-weight: 700;
  margin-bottom: 10px;
}
.progress {
  height: 12px;
  background: #e9edf5;
  border-radius: 99px;
  overflow: hidden;
  margin-bottom: 24px;
}
.bar {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #3d7bed, #8b5cf6);
  transition: width .3s ease;
}
.isotope-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: #f7f9fd;
  border: 2px solid #e0e6f0;
  border-radius: 20px;
  padding: 22px;
  margin-bottom: 26px;
}
.isotope-name {
  font-size: 18px;
  color: #68758e;
  font-weight: 700;
  margin-bottom: 12px;
}
.nuclide {
  position: relative;
  display: inline-block;
  font-family: "Times New Roman", serif;
  font-weight: 700;
  font-size: 88px;
  line-height: 1;
  padding-left: 34px;
}
.nuclide .mass {
  position: absolute;
  left: 0;
  top: 3px;
  font-size: 30px;
  line-height: 1;
}
.nuclide .atomic {
  position: absolute;
  left: 0;
  bottom: 4px;
  font-size: 30px;
  line-height: 1;
}
.question {
  font-size: clamp(22px, 4vw, 30px);
  line-height: 1.3;
  font-weight: 800;
  margin-bottom: 18px;
}
.answer-row {
  display: flex;
  gap: 12px;
  align-items: stretch;
}
input {
  flex: 1;
  min-width: 0;
  border: 2px solid #ccd5e5;
  border-radius: 13px;
  padding: 15px 16px;
  font-size: 22px;
  outline: none;
}
input:focus { border-color: #4b7bec; }
button {
  border: 0;
  border-radius: 13px;
  padding: 14px 22px;
  font-size: 17px;
  font-weight: 700;
  cursor: pointer;
}
.check { background: #4b7bec; color: white; }
.next { background: #27364f; color: white; display: none; margin-top: 10px; }
.feedback {
  min-height: 34px;
  font-size: 18px;
  font-weight: 700;
  margin-top: 16px;
}
.result {
  display: none;
  text-align: center;
  padding: 20px 0 8px;
}
.big-score {
  font-size: 64px;
  font-weight: 900;
  margin: 18px 0;
}
.restart {
  background: #4b7bec;
  color: white;
}
@media (max-width: 560px) {
  .game { padding: 22px; }
  .answer-row { flex-direction: column; }
  .nuclide { font-size: 72px; }
}
</style>
</head>
<body>
<div class="game">
  <div id="quiz">
    <h1>⚛️ Isotooppipeli</h1>
    <div class="subtitle">Tutki isotooppimerkintää ja kirjoita vastaus numerona.</div>

    <div class="top">
      <span id="counter">Kysymys 1 / 20</span>
      <span id="score">Pisteet: 0</span>
    </div>

    <div class="progress"><div class="bar" id="bar"></div></div>

    <div class="isotope-card">
      <div class="isotope-name" id="isotopeName"></div>
      <div class="nuclide">
        <span class="mass" id="mass"></span>
        <span class="atomic" id="atomic"></span>
        <span id="symbol"></span>
      </div>
    </div>

    <div class="question" id="question"></div>

    <div class="answer-row">
      <input id="answer" type="number" inputmode="numeric" autocomplete="off" placeholder="Kirjoita vastaus">
      <button class="check" id="check">Tarkista</button>
    </div>

    <div class="feedback" id="feedback"></div>
    <button class="next" id="next">Seuraava kysymys →</button>
  </div>

  <div class="result" id="result">
    <h1>🎉 Peli päättyi!</h1>
    <div class="big-score" id="finalScore"></div>
    <p id="resultText"></p>
    <button class="restart" onclick="location.reload()">Pelaa uudestaan</button>
  </div>
</div>

<script>
const isotopes = [
  { name: "Hiili-13", symbol: "C", mass: 13, atomic: 6 },
  { name: "Happi-16", symbol: "O", mass: 16, atomic: 8 },
  { name: "Natrium-23", symbol: "Na", mass: 23, atomic: 11 },
  { name: "Kloori-35", symbol: "Cl", mass: 35, atomic: 17 },
  { name: "Kalium-39", symbol: "K", mass: 39, atomic: 19 }
];

const questionTypes = [
  {
    text: iso => `Mikä on ${iso.name}-isotoopin massaluku?`,
    answer: iso => iso.mass
  },
  {
    text: iso => `Mikä on ${iso.name}-isotoopin järjestysluku?`,
    answer: iso => iso.atomic
  },
  {
    text: iso => `Montako protonia ${iso.name}-isotoopin ytimessä on?`,
    answer: iso => iso.atomic
  },
  {
    text: iso => `Montako neutronia ${iso.name}-isotoopin ytimessä on?`,
    answer: iso => iso.mass - iso.atomic
  }
];

let isotopeIndex = 0;
let questionIndex = 0;
let score = 0;
let answered = false;

const totalQuestions = isotopes.length * questionTypes.length;

function currentNumber() {
  return isotopeIndex * questionTypes.length + questionIndex + 1;
}

function render() {
  answered = false;
  const iso = isotopes[isotopeIndex];
  const q = questionTypes[questionIndex];

  document.getElementById("counter").textContent =
    `Kysymys ${currentNumber()} / ${totalQuestions}`;
  document.getElementById("score").textContent = `Pisteet: ${score}`;
  document.getElementById("bar").style.width =
    `${((currentNumber()-1) / totalQuestions) * 100}%`;

  document.getElementById("isotopeName").textContent = iso.name;
  document.getElementById("mass").textContent = iso.mass;
  document.getElementById("atomic").textContent = iso.atomic;
  document.getElementById("symbol").textContent = iso.symbol;

  document.getElementById("question").textContent = q.text(iso);

  const input = document.getElementById("answer");
  input.value = "";
  input.disabled = false;
  input.focus();

  document.getElementById("feedback").textContent = "";
  document.getElementById("next").style.display = "none";
  document.getElementById("check").disabled = false;
}

function checkAnswer() {
  if (answered) return;

  const input = document.getElementById("answer");
  if (input.value.trim() === "") {
    const fb = document.getElementById("feedback");
    fb.textContent = "Kirjoita ensin vastaus.";
    fb.style.color = "#c07a00";
    input.focus();
    return;
  }

  answered = true;

  const iso = isotopes[isotopeIndex];
  const correct = questionTypes[questionIndex].answer(iso);
  const given = Number(input.value);

  const fb = document.getElementById("feedback");

  if (given === correct) {
    score++;
    fb.textContent = "✓ Oikein! Saat yhden pisteen.";
    fb.style.color = "#218c4b";
  } else {
    fb.textContent = `✗ Väärin. Oikea vastaus on ${correct}.`;
    fb.style.color = "#c0392b";
  }

  document.getElementById("score").textContent = `Pisteet: ${score}`;
  input.disabled = true;
  document.getElementById("check").disabled = true;
  document.getElementById("next").style.display = "inline-block";
}

function nextQuestion() {
  questionIndex++;

  if (questionIndex >= questionTypes.length) {
    questionIndex = 0;
    isotopeIndex++;
  }

  if (isotopeIndex >= isotopes.length) {
    finishGame();
  } else {
    render();
  }
}

function finishGame() {
  document.getElementById("quiz").style.display = "none";
  document.getElementById("result").style.display = "block";
  document.getElementById("finalScore").textContent = `${score} / ${totalQuestions}`;

  const ratio = score / totalQuestions;
  let text = "";
  if (ratio === 1) text = "Täydet pisteet – loistavaa!";
  else if (ratio >= 0.8) text = "Hieno tulos! Isotooppien rakenne on hyvin hallussa.";
  else if (ratio >= 0.6) text = "Hyvä tulos! Pieni kertaus tekee vielä varmemmaksi.";
  else text = "Hyvä harjoitus! Pelaa uudestaan ja yritä parantaa tulostasi.";

  document.getElementById("resultText").textContent = text;
}

document.getElementById("check").addEventListener("click", checkAnswer);
document.getElementById("next").addEventListener("click", nextQuestion);

document.getElementById("answer").addEventListener("keydown", e => {
  if (e.key === "Enter") {
    if (!answered) checkAnswer();
    else nextQuestion();
  }
});

render();
</script>
</body>
</html>
