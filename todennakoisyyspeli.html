<!doctype html><html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Todennäköisyyspeli – pallolaatikko</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#17233b;background:#edf3fb}*{box-sizing:border-box}body{margin:0;padding:20px}.wrap{max-width:1080px;margin:auto}h1{text-align:center;margin:6px 0 16px;font-size:clamp(1.7rem,4vw,2.6rem)}.board{display:grid;grid-template-columns:1fr 1fr;gap:20px}.card{background:white;border-radius:20px;box-shadow:0 7px 25px #20345418;padding:22px}.picture{display:flex;flex-direction:column;justify-content:center;align-items:center}.picture svg{width:100%;max-width:540px;height:auto}.hint{color:#52617a;text-align:center;margin:12px 0 0}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:700}.badge{background:#e7f0ff;border-radius:100px;padding:8px 13px}.progress{height:9px;background:#e8edf6;border-radius:20px;margin:18px 0;overflow:hidden}.fill{height:100%;width:0;background:#2563eb;transition:width .25s}.question{font-size:clamp(1.15rem,2.3vw,1.5rem);line-height:1.4;min-height:100px;margin:20px 0}.choices{display:grid;gap:11px}.choice{border:2px solid #d5dfed;background:#f9fbff;border-radius:12px;padding:14px;text-align:left;font-size:1.1rem;font-weight:650;cursor:pointer;color:#17233b;transition:background .15s}.choice:hover:not(:disabled){background:#e9f1ff;border-color:#7aa8ff}.choice:disabled{cursor:default}.choice.correct{background:#d9f9e5;border-color:#159447}.choice.wrong{background:#ffe4e4;border-color:#dc3545}.feedback{min-height:72px;padding-top:15px;font-weight:600;line-height:1.5}.next{width:100%;padding:14px;border:0;border-radius:12px;background:#2563eb;color:white;font-size:1.08rem;font-weight:750;cursor:pointer}.next:disabled{background:#b9c6d8;cursor:default}.end{text-align:center}.end h2{font-size:2rem}.end .big{font-size:3rem;font-weight:800;color:#2563eb}.small{font-size:.9rem;color:#596780}@media(max-width:760px){body{padding:10px}.board{grid-template-columns:1fr}.card{padding:16px}.picture svg{max-width:390px}.question{min-height:0}}
</style></head><body><main class="wrap"><h1>🎯 Todennäköisyyspeli</h1><div class="board"><section class="card picture" aria-label="Laatikko, jossa on kaksi sinistä, kolme punaista ja viisi vihreää palloa"><svg viewBox="0 0 620 450" role="img" aria-label="Laatikossa on 2 sinistä, 3 punaista ja 5 vihreää palloa"><defs><radialGradient id="blue" cx="30%" cy="22%" r="75%"><stop stop-color="#a6d9ff"/><stop offset=".25" stop-color="#238dff"/><stop offset="1" stop-color="#0849b9"/></radialGradient><radialGradient id="red" cx="30%" cy="22%" r="75%"><stop stop-color="#ffb4ac"/><stop offset=".25" stop-color="#ff3c35"/><stop offset="1" stop-color="#b90e16"/></radialGradient><radialGradient id="green" cx="30%" cy="22%" r="75%"><stop stop-color="#c3ffc5"/><stop offset=".25" stop-color="#38d34c"/><stop offset="1" stop-color="#08792d"/></radialGradient><linearGradient id="box" x2="0" y2="1"><stop stop-color="#f6f6f5"/><stop offset="1" stop-color="#c8c9c9"/></linearGradient></defs><path d="M95 55 L550 55 L604 298 L540 385 L35 337 Z" fill="#c9c4be" stroke="#333" stroke-width="5" stroke-linejoin="round"/><path d="M95 55 L550 55 L545 290 L65 290 Z" fill="#dcd7d1"/><g stroke="#1c2634" stroke-width="4"><circle cx="155" cy="155" r="51" fill="url(#blue)"/><circle cx="125" cy="254" r="51" fill="url(#blue)"/><circle cx="275" cy="133" r="51" fill="url(#red)"/><circle cx="395" cy="146" r="51" fill="url(#red)"/><circle cx="310" cy="241" r="51" fill="url(#red)"/><circle cx="507" cy="153" r="51" fill="url(#green)"/><circle cx="205" cy="315" r="51" fill="url(#green)"/><circle cx="417" cy="260" r="51" fill="url(#green)"/><circle cx="310" cy="340" r="51" fill="url(#green)"/><circle cx="510" cy="331" r="51" fill="url(#green)"/></g><path d="M35 337 L540 385 L604 298 L585 386 L540 430 L35 377 Z" fill="url(#box)" stroke="#333" stroke-width="5" stroke-linejoin="round"/><path d="M35 337 L540 385 L540 430 L35 377 Z" fill="url(#box)" stroke="#333" stroke-width="5" stroke-linejoin="round"/><path d="M540 385 L604 298 L585 386 L540 430 Z" fill="#a6a6a6" stroke="#333" stroke-width="5" stroke-linejoin="round"/></svg><p class="hint">Laatikosta nostetaan satunnaisesti yksi pallo.<br>Jokainen pallo on yhtä todennäköinen.</p></section><section class="card"><div id="game"><div class="top"><span class="badge" id="counter">Kysymys 1/9</span><span class="badge" id="score">Pisteet: 0/9</span></div><div class="progress"><div class="fill" id="fill"></div></div><h2 class="question" id="question"></h2><div class="choices" id="choices"></div><div class="feedback" id="feedback" aria-live="polite"></div><button class="next" id="next" disabled>Seuraava kysymys →</button></div></section></div><p class="small" style="text-align:center">Vastaa kaikkiin yhdeksään kysymykseen. Oikeasta vastauksesta saa yhden pisteen.</p></main><script>
const data=[
['Millä todennäköisyydellä laatikosta nostettu pallo on vihreä?',50,[20,30,50,70]],
['Millä todennäköisyydellä laatikosta nostettu pallo on sininen?',20,[10,20,30,50]],
['Millä todennäköisyydellä laatikosta nostettu pallo on punainen?',30,[20,30,40,70]],
['Millä todennäköisyydellä laatikosta nostettu pallo on sininen tai punainen?',50,[20,30,50,80]],
['Millä todennäköisyydellä laatikosta nostettu pallo on vihreä tai punainen?',80,[30,50,70,80]],
['Millä todennäköisyydellä laatikosta nostettu pallo on vihreä tai sininen?',70,[20,50,70,80]],
['Millä todennäköisyydellä laatikosta nostettu pallo ei ole punainen?',70,[30,50,70,80]],
['Millä todennäköisyydellä laatikosta nostettu pallo ei ole sininen?',80,[20,50,70,80]],
['Millä todennäköisyydellä laatikosta nostettu pallo ei ole vihreä?',50,[20,30,50,80]]];
let index=0,points=0,answered=false;
const $=id=>document.getElementById(id);
function render(){answered=false;const [q,correct,opts]=data[index];$('counter').textContent=`Kysymys ${index+1}/9`;$('score').textContent=`Pisteet: ${points}/9`;$('fill').style.width=`${index/9*100}%`;$('question').textContent=q;$('feedback').textContent='';$('next').disabled=true;$('next').textContent=index===8?'Näytä tulokset →':'Seuraava kysymys →';$('choices').innerHTML='';opts.forEach((v,i)=>{const b=document.createElement('button');b.className='choice';b.textContent=`${'ABCD'[i]}. ${v} %`;b.addEventListener('click',()=>answer(v,b));$('choices').appendChild(b)})}
function answer(v,selected){if(answered)return;answered=true;const correct=data[index][1];if(v===correct)points++;document.querySelectorAll('.choice').forEach(b=>{b.disabled=true;if(b.textContent.endsWith(`${correct} %`))b.classList.add('correct')});if(v!==correct)selected.classList.add('wrong');$('feedback').textContent=v===correct?`✅ Oikein! Todennäköisyys on ${correct} %. +1 piste.`:`❌ Ei aivan. Oikea vastaus on ${correct} %.`; $('score').textContent=`Pisteet: ${points}/9`;$('next').disabled=false}
$('next').addEventListener('click',()=>{index++;if(index<9)render();else finish()});function finish(){$('fill').style.width='100%';const msg=points===9?'Täydellinen suoritus! 🌟':points>=7?'Hienosti tehty! 👏':points>=4?'Hyvää harjoittelua! 👍':'Harjoittelemalla opit! 💪';$('game').innerHTML=`<div class="end"><h2>Peli päättyi!</h2><div class="big">${points}/9</div><p>${msg}</p><p>Sait ${points} pistettä yhdeksästä mahdollisesta.</p><button class="next" onclick="location.reload()">Pelaa uudestaan ↻</button></div>`}render();
</script></body></html>
