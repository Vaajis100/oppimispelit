<!doctype html><html lang="fi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sähkökemia Dash</title><style>*{box-sizing:border-box}body{margin:0;background:#080d20;color:#eafaff;font:16px system-ui;text-align:center}main{max-width:1000px;margin:auto;padding:12px}h1{color:#55eaff;letter-spacing:3px;margin:12px}canvas{width:100%;display:block;border:1px solid #477baf;border-radius:14px;touch-action:none;background:#101930}button{background:#18365a;color:white;border:1px solid #53cbe8;border-radius:12px;padding:14px 20px;font:inherit;cursor:pointer;touch-action:manipulation}button:hover{background:#285480}#hud{display:flex;justify-content:space-between;padding:12px;font-weight:bold}#layer{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#080d20d9;border-radius:14px;padding:10px;overflow:auto}#panel{width:min(580px,100%);margin:auto;background:#142541;padding:18px;border-radius:16px;border:1px solid #50cce5}#answers{display:grid;gap:8px}#answers button{text-align:left}#jump{width:100%;margin-top:12px;background:#174c62;font-weight:bold}#stage{position:relative}#feedback{min-height:24px;color:#ffe282}p{line-height:1.45} @media(max-width:600px){#stage{min-height:390px}canvas{height:auto;min-height:220px}#panel{padding:12px}button{padding:10px}h1{font-size:24px}}</style><main><h1>⚡ SÄHKÖKEMIA DASH</h1><div>METALLIT • ELEKTRONIT • ENERGIA</div><div id="hud"><span id="energy">⚡ 3</span><span id="level">Kenttä 1</span><span id="score">Oikein: 0</span></div><div id="stage"><canvas id="c" width="900" height="420"></canvas><div id="layer"><div id="panel"></div></div></div><button id="jump">▲ HYPPÄÄ</button><p>Välilyönti, nuoli ylös tai kosketus = hyppy. Hyppää tasoille ja kerää kaikki keltaiset kysymyslaatikot. Oikea vastaus +1 energia, väärä −1. Esteeseen osuminen −1.</p></main><script>
const raw=`Mikä on metallien tyypillinen ominaisuus?|Hyvä sähkönjohtavuus|Hauraus kaikissa oloissa|Sähköneristävyys

Mikä on teräksen pääasiallinen alkuaine?|Rauta|Kupari|Sinkki
Miksi metalleja kierrätetään?|Raaka-aineiden ja energian säästämiseksi|Jotta malmia tarvittaisiin enemmän|Jotta metallit ruostuisivat nopeammin
Mikä näistä johtaa sähköä parhaiten?|Hopea|Lasi|Kumi
Mikä näistä on elektrolyytti?|Suolaliuos|Kuiva muovi|Puhdas kuparilanka
Mitä plusmerkkinen metalli-ioni on menettänyt?|Elektroneja|Protoneja|Kaikki neutronit
Miksi ruostumaton teräs kestää korroosiota?|Pinnalle muodostuu suojaava oksidikerros|Siinä ei ole lainkaan rautaa|Se ei reagoi koskaan missään oloissa
Mistä tiedetään, että metalli on jalo?|Se ei yleensä vapauta vetykaasua reagoidessaan laimean suolahapon kanssa|Se vapauttaa vetykaasua laimeassa suolahapossa|Se luovuttaa elektroneja helpommin kuin vety
Mistä tiedetään, että metalli on epäjalo?|Se on jännitesarjassa ennen vetyä ja voi vapauttaa vetykaasua laimeasta suolahaposta|Se on jännitesarjassa vedyn jälkeen|Se vastaanottaa elektroneja aina helpommin kuin jalot metallit
Mikä näistä on raudan ja sinkin välinen hapettumis-pelkistymisreaktio?|Zn + Fe²⁺ → Zn²⁺ + Fe|Fe + Zn²⁺ → Fe²⁺ + Zn|Zn²⁺ + Fe²⁺ → Zn + Fe
Mitä tapahtuu, jos rautanaula laitetaan kuparisulfaattiliuokseen?|Sen päälle pelkistyy kuparia|Sen päälle pelkistyy sinkkiä|Kupari hapettuu ja rauta pelkistyy

Mitä sähkökemiallisessa parissa tapahtuu?|Kemiallisen reaktion avulla saadaan aikaan sähkövirtaa|Sähkövirran avulla pakotetaan tapahtumaan kemiallinen reaktio|Sähkövirta syntyy ilman kemiallista reaktiota
Mitä on ruosta?|Raudan oksidien ja oksihydroksidien seosta|Puhdasta metallista rautaa|Raudan ja hiilen metalliseosta
Mikä on uhrimetalli?|Suojattavaa metallia epäjalompi metalli, joka hapettuu sen sijasta|Suojattavaa metallia jalompi metalli, joka ei hapetu|Metalli, joka estää korroosion vain peittämällä pinnan`;
const bank=raw.split('\n').map(x=>x.split('|')),$=id=>document.getElementById(id),c=$('c'),ctx=c.getContext('2d');
const names=['Metallitehdas','Pronssipaja','Jännitesarja','Elektronitunneli','Paristotehdas','Elektrolyysilaitos','Korroosioluola','Masuuni'], colors=['#42e5ff','#e9ad63','#b7f75e','#ac83ff','#ffe05b','#55efd0','#f58b59','#ff526b'];
const G=360,P=120,S=32;let state='menu',level=0,energy=3,right=0,answered=0,dist=0,y=0,vy=0,grounded=true,objects=[],deck=[],last=0,flash=0,checkpoint=0,held=false,finishX=0,levelAnswers=0;
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function hud(){$('energy').textContent='⚡ '+energy;$('level').textContent=(level+1)+'/8 '+names[level];$('score').textContent='Oikein: '+right+' / '+answered}
function overlay(html){$('layer').style.display='flex';$('panel').innerHTML=html}
function build(){objects=[];dist=0;y=vy=0;grounded=true;checkpoint=0;levelAnswers=0;flash=0;let x=650;const add=(kind,x,h,w)=>objects.push({kind,x,h,w,hit:false});for(let k=0;k<4;k++){let n=level===0?1:level<3?2:3;let step=level<2?80:90;let widths=Array.from({length:n},(_,i)=>level>=4?260+((k+i)%3)*30:280);add('spike',x-170,0,36);let top=x;for(let i=0;i<n;i++){add('platform',top,step*(i+1),widths[i]);if(level>=5&&i===0)add('spike',top+85,step*(i+1),32);if(i<n-1)top+=widths[i]-35;}add('q',top+widths[n-1]-85,n*step,42);x=top+widths[n-1]+550;}finishX=x-100;}
function start(){level=0;energy=3;right=answered=0;deck=shuffle(bank);begin()}
function begin(){build();hud();state='ready';overlay(`<h2>Kenttä ${level+1}: ${names[level]}</h2><p>Kerää neljä kysymyslaatikkoa. Hyppää tasolta toiselle. Voit pitää hyppypainiketta pohjassa toistuvia hyppyjä varten.</p><button onclick="resume()">ALOITA KENTTÄ</button>`)}
function resume(){state='run';held=false;$('layer').style.display='none'}
function menu(){overlay('<h2>⚡ Sähkökemia Dash 2</h2><p>8 kenttää, 32 kysymystä ja monikerroksisia hyppytasoja. Kysymyslaatikot ovat pakollisia: ohitettu laatikko palauttaa sinut harjoittelemaan samaa kohtaa.</p><button onclick="start()">ALOITA PELI</button>')}
function finish(win){state='end';overlay(`<h2>${win?'🏆 Kaikki kentät läpäisty!':'Energia loppui!'}</h2><p>Oikein ${right} / ${answered} • Energia ${energy}</p><button onclick="start()">Pelaa uudelleen</button>`)}
function quiz(o){o.hit=true;state='quiz';held=false;if(!deck.length)deck=shuffle(bank);let q=deck.pop();overlay('<div style="color:#ffdc62">KYSYMYS '+(answered+1)+' / 32</div><h2></h2><div id="answers"></div><p id="feedback"></p>');$('panel').querySelector('h2').textContent=q[0];shuffle(q.slice(1)).forEach(a=>{let b=document.createElement('button');b.textContent=a;b.onclick=()=>{if(state!=='quiz')return;state='feedback';answered++;levelAnswers++;let ok=a===q[1];energy+=ok?1:-1;if(ok)right++;hud();for(let el of $('answers').children){el.disabled=true;if(el.textContent===q[1])el.style.background='#176348';else if(el===b)el.style.background='#8b293c'}$('feedback').textContent=ok?'Oikein! +1 energia':'Väärin. Oikea vastaus: '+q[1];let n=document.createElement('button');n.textContent='Jatka';n.onclick=()=>{if(energy<=0)return finish(false);checkpoint=o.x+110-P;resume()};$('panel').append(n)};$('answers').append(b)})}
function jump(){if(state==='run'&&grounded){vy=590;grounded=false}}
function press(e){if(state==='run'){e.preventDefault();held=true;jump()}}function release(){held=false}window.addEventListener('keydown',e=>{if(['Space','ArrowUp'].includes(e.code)&&state==='run')press(e)});window.addEventListener('keyup',release);for(let el of [c,$('jump')]){el.addEventListener('pointerdown',press);el.addEventListener('pointerup',release);el.addEventListener('pointercancel',release);el.addEventListener('pointerleave',release)}window.addEventListener('blur',release);
function retry(){state='retry';held=false;overlay('<h2>Kysymyslaatikko jäi väliin!</h2><p>Hyppää tasojen päälle ja yritä uudelleen. Et menetä energiaa ohitetusta laatikosta.</p><button onclick="retryGo()">YRITÄ UUDELLEEN</button>')}
function retryGo(){dist=checkpoint;y=vy=0;grounded=true;for(let o of objects)if(o.kind==='spike'&&o.x>dist+P)o.hit=false;resume()}
function draw(){let col=colors[level],g=ctx.createLinearGradient(0,0,0,420);g.addColorStop(0,'#17243d');g.addColorStop(1,'#080d20');ctx.fillStyle=g;ctx.fillRect(0,0,900,420);ctx.strokeStyle=col+'22';for(let i=-dist%50;i<900;i+=50){ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,420);ctx.stroke()}for(let i=0;i<420;i+=40){ctx.beginPath();ctx.moveTo(0,i);ctx.lineTo(900,i);ctx.stroke()}for(let i=0;i<12;i++){let x=((i*173-dist*.25)%960+960)%960,yy=40+i*53%280;ctx.strokeStyle=col+'55';ctx.beginPath();ctx.ellipse(x,yy,24,10,i,0,7);ctx.stroke();ctx.fillStyle=col;ctx.beginPath();ctx.arc(x+20*Math.cos(dist*.009+i),yy+8*Math.sin(dist*.009+i),3,0,7);ctx.fill()}ctx.fillStyle='#172b46';ctx.fillRect(0,G,900,60);ctx.fillStyle=col;ctx.fillRect(0,G,900,3);for(let o of objects){let x=o.x-dist,b=G-o.h;if(x+o.w<0||x>900||o.hit)continue;if(o.kind==='platform'){ctx.fillStyle='#20334f';ctx.fillRect(x,b,o.w,20);ctx.strokeStyle=col;ctx.strokeRect(x,b,o.w,20);ctx.fillStyle=col;ctx.fillRect(x,b,o.w,4);for(let j=8;j<o.w-10;j+=28){ctx.fillStyle=col+'33';ctx.fillRect(x+j,b+8,15,5)}}else if(o.kind==='q'){ctx.fillStyle='#ffce45';ctx.shadowColor='#ffce45';ctx.shadowBlur=16;ctx.fillRect(x,b-48,o.w,48);ctx.shadowBlur=0;ctx.fillStyle='#352800';ctx.font='bold 32px system-ui';ctx.fillText('?',x+12,b-12)}else{ctx.fillStyle='#ff527f';ctx.beginPath();ctx.moveTo(x,b);ctx.lineTo(x+o.w/2,b-34);ctx.lineTo(x+o.w,b);ctx.fill()}}ctx.fillStyle=col;ctx.fillRect(finishX-dist,G-140,8,140);ctx.font='bold 20px system-ui';ctx.fillText('MAALI',finishX-dist-28,G-150);ctx.save();ctx.translate(P+S/2,G-y-S/2);ctx.rotate(grounded?0:dist*.012);ctx.fillStyle=flash>0?'#ff527f':col;ctx.shadowColor=col;ctx.shadowBlur=14;ctx.fillRect(-16,-16,32,32);ctx.shadowBlur=0;ctx.fillStyle='#101d32';ctx.fillRect(-11,-11,22,22);ctx.fillStyle='#ffe75b';ctx.font='24px system-ui';ctx.fillText('ϟ',-7,9);ctx.restore();ctx.fillStyle='#ffffff';ctx.font='15px system-ui';ctx.fillText('Laatikot '+levelAnswers+'/4',15,25);ctx.fillStyle='#ffffff33';ctx.fillRect(15,34,870,5);ctx.fillStyle=col;ctx.fillRect(15,34,870*Math.min(1,dist/finishX),5)}
function loop(t){let dt=Math.min((t-last)/1000||0,.025);last=t;if(state==='run'){if(held&&grounded)jump();dist+=(205+level*8)*dt;let old=y;vy-=1450*dt;y+=vy*dt;grounded=false;let left=dist+P,r=left+S;if(vy<=0){let floor=0;for(let o of objects)if(o.kind==='platform'&&r>o.x&&left<o.x+o.w&&old>=o.h-1&&y<=o.h)floor=Math.max(floor,o.h);if(y<=floor){y=floor;vy=0;grounded=true}}flash=Math.max(0,flash-dt);for(let o of objects){if(o.hit||o.kind==='platform')continue;if(o.kind==='q'&&left>o.x+o.w+50){retry();break}if(r>o.x&&left<o.x+o.w&&y<o.h+(o.kind==='q'?48:30)&&y+S>o.h){if(o.kind==='q'){quiz(o);break}if(!flash){o.hit=true;energy--;flash=.6;hud();if(energy<=0){finish(false);break}}}}if(state==='run'&&levelAnswers===4&&left>finishX){if(level===7)finish(true);else{level++;begin()}}}draw();requestAnimationFrame(loop)}menu();hud();requestAnimationFrame(loop);
</script></html>
