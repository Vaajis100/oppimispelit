<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Plus- ja miinuslaskupeli</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #e8f5ff, #f7fbff);
      color: #1f2937;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 30px 16px;
    }

    .game {
      width: 100%;
      max-width: 760px;
      background: white;
      border-radius: 22px;
      padding: 28px;
      box-shadow: 0 12px 35px rgba(0,0,0,0.12);
    }

    h1 {
      margin-top: 0;
      text-align: center;
      font-size: clamp(28px, 5vw, 42px);
      color: #1565c0;
    }

    .info {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 20px;
      font-size: 18px;
      font-weight: bold;
    }

    .info-box {
      background: #f1f7ff;
      border-radius: 12px;
      padding: 10px 16px;
      flex: 1;
      min-width: 140px;
      text-align: center;
    }

    .tasks {
      display: grid;
      gap: 10px;
    }

    .task {
      display: grid;
      grid-template-columns: max-content 120px 44px;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      border-radius: 12px;
      background: #f8fafc;
      border: 2px solid #e5e7eb;
    }

    .expression {
      font-size: 26px;
      font-weight: bold;
      text-align: left;
    }

    input {
      width: 100%;
      padding: 10px;
      font-size: 22px;
      text-align: center;
      border-radius: 9px;
      border: 2px solid #b7c4d4;
      outline: none;
    }

    input:focus {
      border-color: #1976d2;
      box-shadow: 0 0 0 3px rgba(25,118,210,0.12);
    }

    input:disabled {
      background: #f3f4f6;
      color: #374151;
    }

    .mark {
      font-size: 30px;
      font-weight: bold;
      text-align: center;
      min-height: 36px;
    }

    .correct {
      color: #16a34a;
    }

    .wrong {
      color: #dc2626;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 22px;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 13px 22px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.1s ease, opacity 0.2s ease;
    }

    button:hover:not(:disabled) {
      transform: translateY(-1px);
    }

    button:disabled {
      opacity: 0.45;
      cursor: default;
    }

    #checkBtn {
      background: #1565c0;
      color: white;
    }

    #newBtn {
      background: #f59e0b;
      color: #111827;
    }

    #restartBtn {
      background: #16a34a;
      color: white;
      display: none;
    }

    .message {
      text-align: center;
      margin-top: 18px;
      min-height: 32px;
      font-size: 20px;
      font-weight: bold;
    }

    .final {
      margin-top: 24px;
      padding: 24px;
      text-align: center;
      background: #ecfdf5;
      border: 3px solid #22c55e;
      border-radius: 16px;
      font-size: 30px;
      font-weight: bold;
      display: none;
    }

    @media (max-width: 560px) {
      .game {
        padding: 18px;
      }

      .task {
        grid-template-columns: max-content 90px 36px;
        gap: 8px;
        padding: 8px;
      }

      .expression {
        font-size: 21px;
      }

      input {
        font-size: 19px;
      }

      .mark {
        font-size: 26px;
      }
    }
  </style>
</head>

<body>
  <main class="game">
    <h1>Plus- ja miinuslaskupeli</h1>

    <div class="info">
      <div class="info-box">Tehtävät: <span id="progress">0 / 30</span></div>
      <div class="info-box">Pisteet: <span id="score">0</span></div>
      <div class="info-box">Kierros: <span id="round">1 / 3</span></div>
    </div>

    <div id="tasks" class="tasks"></div>

    <div class="buttons">
      <button id="checkBtn">Tarkista vastaukset</button>
      <button id="newBtn" disabled>Arvo uudet 10 tehtävää</button>
      <button id="restartBtn">Pelaa uudestaan</button>
    </div>

    <div id="message" class="message"></div>
    <div id="final" class="final"></div>
  </main>

  <script>
    const MAX_NUMBER = 20;
    const TASKS_PER_ROUND = 10;
    const TOTAL_TASKS = 30;

    let currentTasks = [];
    let score = 0;
    let answeredCount = 0;
    let round = 1;
    let roundChecked = false;

    const tasksEl = document.getElementById("tasks");
    const scoreEl = document.getElementById("score");
    const progressEl = document.getElementById("progress");
    const roundEl = document.getElementById("round");
    const messageEl = document.getElementById("message");
    const finalEl = document.getElementById("final");
    const checkBtn = document.getElementById("checkBtn");
    const newBtn = document.getElementById("newBtn");
    const restartBtn = document.getElementById("restartBtn");

    function randomInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function shuffle(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    function createAddition() {
      const a = randomInt(0, MAX_NUMBER);
      const b = randomInt(0, MAX_NUMBER);

      return {
        text: `${a} + ${b} =`,
        answer: a + b
      };
    }

    function createSubtraction() {
      // Valitaan ensin kaksi luonnollista lukua väliltä 0–20.
      // Suurempi asetetaan aina ensimmäiseksi, joten vastaus ei voi olla negatiivinen.
      const a = randomInt(0, MAX_NUMBER);
      const b = randomInt(0, MAX_NUMBER);
      const larger = Math.max(a, b);
      const smaller = Math.min(a, b);

      return {
        text: `${larger} − ${smaller} =`,
        answer: larger - smaller
      };
    }

    function generateTasks() {
      currentTasks = [];

      for (let i = 0; i < 5; i++) {
        currentTasks.push(createAddition());
        currentTasks.push(createSubtraction());
      }

      shuffle(currentTasks);
      renderTasks();

      roundChecked = false;
      messageEl.textContent = "";
      checkBtn.disabled = false;
      newBtn.disabled = true;
    }

    function renderTasks() {
      tasksEl.innerHTML = "";

      currentTasks.forEach((task, index) => {
        const row = document.createElement("div");
        row.className = "task";

        const expression = document.createElement("div");
        expression.className = "expression";
        expression.textContent = task.text;

        const input = document.createElement("input");
        input.type = "number";
        input.min = "0";
        input.inputMode = "numeric";
        input.id = `answer-${index}`;
        input.setAttribute("aria-label", `Vastaus tehtävään ${index + 1}`);

        input.addEventListener("keydown", (event) => {
          if (event.key === "Enter" && !roundChecked) {
            event.preventDefault();

            if (index < currentTasks.length - 1) {
              const nextInput = document.getElementById(`answer-${index + 1}`);
              if (nextInput) nextInput.focus();
            } else {
              checkAnswers();
            }
          }
        });

        const mark = document.createElement("div");
        mark.className = "mark";
        mark.id = `mark-${index}`;

        row.appendChild(expression);
        row.appendChild(input);
        row.appendChild(mark);
        tasksEl.appendChild(row);
      });

      const firstInput = document.getElementById("answer-0");
      if (firstInput) firstInput.focus();
    }

    function checkAnswers() {
      if (roundChecked) return;

      const inputs = currentTasks.map((_, index) =>
        document.getElementById(`answer-${index}`)
      );

      const allAnswered = inputs.every(input => input.value.trim() !== "");

      if (!allAnswered) {
        messageEl.textContent = "Vastaa ensin kaikkiin 10 tehtävään.";
        messageEl.style.color = "#dc2626";
        return;
      }

      let roundScore = 0;

      currentTasks.forEach((task, index) => {
        const input = document.getElementById(`answer-${index}`);
        const mark = document.getElementById(`mark-${index}`);
        const playerAnswer = Number(input.value);

        input.disabled = true;

        if (playerAnswer === task.answer) {
          roundScore++;
          mark.textContent = "✓";
          mark.className = "mark correct";
        } else {
          mark.textContent = "✗";
          mark.className = "mark wrong";
        }
      });

      score += roundScore;
      answeredCount += TASKS_PER_ROUND;
      roundChecked = true;

      updateInfo();

      messageEl.textContent = `Tällä kierroksella sait ${roundScore} / 10 pistettä.`;
      messageEl.style.color = "#166534";

      checkBtn.disabled = true;

      if (answeredCount >= TOTAL_TASKS) {
        endGame();
      } else {
        newBtn.disabled = false;
      }
    }

    function updateInfo() {
      scoreEl.textContent = score;
      progressEl.textContent = `${answeredCount} / ${TOTAL_TASKS}`;
      roundEl.textContent = `${round} / 3`;
    }

    function nextRound() {
      if (!roundChecked || answeredCount >= TOTAL_TASKS) return;

      round++;
      updateInfo();
      generateTasks();
    }

    function endGame() {
      newBtn.disabled = true;
      checkBtn.disabled = true;

      finalEl.style.display = "block";
      finalEl.textContent = `Sait ${score} / ${TOTAL_TASKS} p`;
      restartBtn.style.display = "inline-block";
      messageEl.textContent = "Peli päättyi!";
    }

    function restartGame() {
      score = 0;
      answeredCount = 0;
      round = 1;
      roundChecked = false;

      finalEl.style.display = "none";
      finalEl.textContent = "";
      restartBtn.style.display = "none";

      updateInfo();
      generateTasks();
    }

    checkBtn.addEventListener("click", checkAnswers);
    newBtn.addEventListener("click", nextRound);
    restartBtn.addEventListener("click", restartGame);

    updateInfo();
    generateTasks();
  </script>
</body>
</html>
